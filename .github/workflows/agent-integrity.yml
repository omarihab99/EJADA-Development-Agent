name: agent-integrity

on:
  pull_request:
    paths:
      - ".github/**"
      - "governance/**"
      - "registry/**"
      - "scripts/**"
      - "tests/**"
      - "non-dev-agents/**"
      - "README.md"
  push:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - name: Agent suite integrity tests
        run: python -m pytest -q tests
      - name: Registry is up to date with agent files
        run: python scripts/registry_build.py --check
